<!DOCTYPE html>
<html lang="en">

<header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 05 HTML Forms </title>
    <link rel="stylesheet" href="styles/poll-form.css">
</header>

<main>
    <h1>WDD 130 | Week 05 HTML Forms</h1>
    <form>
        <fieldset>
            <legend>Contact Information</legend>
            <div class="form-item column2">
                <label for="fullname">Full name:</label>
                <input type="text" id="fullname" name="fullname" required>
                <!-- <label> Full name: <input type="text" name="fullname" required> </label> -->
            </div>
            <div class="form-item column2">
                <label for="useremail">Email:</label>
                <input type="email" id="useremail" name="useremail" required>
                <!-- <label> Email: <input type="email" name="email" required> </label> -->
            </div>
        </fieldset>
        <fieldset>
            <legend>Questions</legend>
            <div class="form-item column1">
                <label for="browser">What is your favorite browser?</label>
                <select name="browser" id="browser">
                    <option value="1"> Safari </option>
                    <option value="2"> Chrome </option>
                    <option value="3"> Edge </option>
                    <option value="4"> Other </option>
                </select>
            </div>
            <div class="form-item column1">
                <label for="pet">Do you have a household pet? </label>
                <input type="checkbox" id="pet" name="pet">
            </div>
            <div class="form-item">
                <label for="feedback">List the places you have lived: </label>
                <textarea id="feedback" name="feedback" rows="4"
                  placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            </div>
        </fieldset>
        <button type="submit">Submit Poll</button>
    </form>
</main>

<footer>
    <p>
        &copy; 2026 |WDD 130 | HTML Forms | Clara Guevara
    </p>
</footer>

</html>
