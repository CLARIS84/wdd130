<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Form Example </title>
    <meta name="description" content="A simple quiz form example for week 5.">
    <meta name="author" content="Clara Guevara">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>Quiz Form Example</h1>
        <form action="#">
            <fieldset>
                <legend>Input fields</legend>
                <label for="q1"><span class="number">1. </span>&nbsp;What does the acronym CSS
                    stands
                    for?</label>
                <input type="text" name="q1" id="q1" required>
                <label for="q2"><span class="number">2. </span>&nbsp;How are id and class attributes
                    selected in CSS?</label>
                <textarea name="q2" id="q2" rows="5" required></textarea>
                <label for="q3"><span class="number">3.</span> &nbsp;Wich of the following is a
                    valid CSS
                    comment?</label>
                <select name="q3" id="q3">
                    <option value="0">Choose One...</option>
                    <option value="1">Comment 1</option>
                    <option value="2">Comment 2</option>
                    <option value="3">Comment 3</option>
                    <option value="4">Comment 4</option>
                </select>
                <label for="q4"><span class="number">4.</span> &nbsp;What is the bottom margin given
                    this
                    declaration?</label>
                <p class="code">margin: 10px 5px 15px;</p>
                <input type="text" name="q4" id="q4" required>
            </fieldset>
            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>
<footer>
    <p>

    </p>
</footer>

</html>
