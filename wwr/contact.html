<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White water rafting </title>
    <meta name="description"
      content="Provides contact information and a form to obtain user input including questions and comments.">
    <meta name="author" content="Clara Luz Guevara Cruz">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr-logo.png" alt="blue circled splash white water rafting logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="information">
            <h1>White Water Rafting Company </h1>
            <p>Address: Blvd. Manuel Ávila C. S/N Col. Sutsem. Boca del Rio, Ver.</p>
            <p>Phone Number: (+52) 557 447 31 91</p>
            <p>Email: WhiteWaterC@gmail.com</p>
        </section>
        <section class="contact">
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d26288.11333649607!2d-96.10713331891179!3d19.17233836295528!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2smx!4v1791326273801!5m2!1ses!2smx"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <form action="#">
                <fieldset>
                    <div>
                        <label for="name">Name:</label>
                        <input type="text" name="name" id="name" required>
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="text" name="email" id="email" required>
                    </div>
                    <div>
                        <label for="purpose">Message Purpose:</label>
                        <div>
                            <input type="radio" name="purpose" id="general" value="general">
                            <label for="general">General Inquiry</label>
                        </div>
                        <div>
                            <input type="radio" name="purpose" id="reservation" value="reservation">
                            <label for="general">Reservation Question</label>
                        </div>
                        <div>
                            <input type="radio" name="purpose" id="suggestion" value="suggestion">
                            <label for="general">Website Suggestion</label>
                        </div>
                    </div>
                    <div>
                        <label for="message">Message:</label>
                        <div>
                            <textarea name="message" id="message"></textarea>
                        </div>
                    </div>
                    <div>
                        <input type="checkbox" id="subscribe" name="subscribe">
                        <label for="subscribe">Please Subscribe me to the monthly newsletter</label>
                    </div>
                </fieldset>
                <button type="submit">Get in Touch!</button>
            </form>
            </div>
        </section>
        <section class="employees">
            <h2>We are here to serve you</h2>
            <figure>
                <img src="images/employee1.jpg" alt="Employee number 1. Photo of Clara Guevara">
                <figcaption> Clara Guevara </figcaption>
                <figcaption> Owner </figcaption>
            </figure>
            <figure>
                <img src="images/hcostumer.jpg" alt="Employee number 2. Photo of Daniel Martinez">
                <figcaption> Daniel Martinez </figcaption>
                <figcaption> Manager </figcaption>
            </figure>
            <figure>
                <img src="images/employee3.jpg" alt="Employee number 3. Photo of Santiago Rendón ">
                <figcaption> Santiago Rendón </figcaption>
                <figcaption> Tour guide </figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p> &copy; 2026 | White Water Rafting | Clara Luz Guevara Cruz.</p>
        <nav class="socialmedia">
            <a href="https://facebook.com" target="_blank">
                <img src="images/facebook.svg" alt="Follow us on Facebook (opens in new tab)">
            </a>
            <a href="https://youtube.com" target="_blank">
                <img src="images/youtube.svg" alt="Follow us on Youtube (opens in new tab)">
            </a>
            <a href="https://instagram.com" target="_blank">
                <img src="images/instagram.svg" alt="Follow us on Instagram (opens in new tab)">
            </a>
        </nav>
    </footer>

</body>

</html>
